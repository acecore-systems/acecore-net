<!doctype html>

      * {

      }
      html {

          'Segoe UI',
          'Noto Sans JP',

        line-height: 1.7;
      }
      main {
        max-width: 1480px;
        margin-inline: auto;
        padding: 40px 20px 64px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.25;
        letter-spacing: -0.035em;
      }
      h2 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.35;
      }
      p {
        margin: 0;
      }
      .intro {
        max-width: 50rem;
        color: #50565e;
      }
      .review-note {
        margin-top: 12px;
        font-size: 0.875rem;
        color: #50565e;
      }
      a {
        color: #0656d9;
        text-underline-offset: 0.2em;
      }
      a:focus-visible {
        outline: 3px solid #0656d9;
        outline-offset: 4px;
        border-radius: 2px;
      }
      .link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding-block: 8px;
        font-weight: 650;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 40px 24px;
        margin-top: 36px;
      }
      .site {
        min-width: 0;
        border-top: 1px solid #cfd4dc;
        padding-top: 20px;
        scroll-margin-top: 24px;
      }
      .site-head {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .site-head .link {
        margin-top: 4px;
        font-size: 0.9rem;
      }
      figure {
        margin: 0;
      }
      .sample {
        background: #fff;
        border: 1px solid #e0e4eb;
        border-radius: 8px;
        padding: 20px 16px;
        text-align: center;
      }
      .sample + .sample {
        margin-top: 16px;
      }
      figcaption {
        font-size: 0.875rem;
        font-weight: 650;
        margin-bottom: 16px;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .large {
        width: min(208px, 100%);
        aspect-ratio: 1;
        margin-inline: auto;
      }
      .sizes {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 24px;
        list-style: none;
        margin: 20px 0 0;
        padding: 0;
      }
      .sizes li {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .sizes span {
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }
      .dark {
        background: #00022b;
        color: #f3f6ff;
        border-color: #00022b;
      }
      .corporate {
        color: #0656d9;
      }
      .systems {
        color: #6334a4;
      }
      .schools {
        color: #176b45;
      }
      .designs {
        display: inline-block;
        color: #8146ae;
        background: linear-gradient(
          110deg,
          #986000,
          #b33e71 35%,
          #8146ae 65%,
          #0656d9
        );
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .original {
        border-top: 1px solid #cfd4dc;
        margin-top: 40px;
        padding-top: 24px;
      }
      .original p {
        font-size: 0.875rem;
        color: #50565e;
      }
      @media (min-width: 760px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (min-width: 1180px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        main {
          padding-inline: 32px;
        }
      }
    </style>
