name: Check Blog Translation Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Evaluate synthetic translations without collecting or publishing
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          BLOG_REVIEW_REPORT_PATH: ${{ runner.temp }}/blog-translation-review.json
        run: BLOG_REVIEW_CODE_REF="$(git rev-parse HEAD)" node --experimental-strip-types scripts/evaluate-blog-translations.ts
      - name: Save safe evaluation metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blog-translation-review
          path: ${{ runner.temp }}/blog-translation-review.json
          if-no-files-found: error
          retention-days: 14
