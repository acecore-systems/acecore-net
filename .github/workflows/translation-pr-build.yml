name: Translation PR Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to build manually
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((startsWith(github.event.pull_request.head.ref, 'translation/workers-ai/') &&
      startsWith(github.event.pull_request.title, '[translation] Workers AI Batch ')) ||
      (startsWith(github.event.pull_request.head.ref, 'translation/openai/') &&
      startsWith(github.event.pull_request.title, '[translation] OpenAI Batch ')))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request metadata
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr_json=$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json number,headRefName,headRefOid,title)
            echo "number=$(echo "$pr_json" | jq -r '.number')" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(echo "$pr_json" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$pr_json" | jq -r '.headRefOid')" >> "$GITHUB_OUTPUT"
            echo "title=$(echo "$pr_json" | jq -r '.title')" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head_ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if manual target is not an eligible translation PR
        if: >-
          github.event_name == 'workflow_dispatch' &&
          !((startsWith(steps.pr.outputs.head_ref, 'translation/workers-ai/') &&
          startsWith(steps.pr.outputs.title, '[translation] Workers AI Batch ')) ||
          (startsWith(steps.pr.outputs.head_ref, 'translation/openai/') &&
          startsWith(steps.pr.outputs.title, '[translation] OpenAI Batch ')))
        run: |
          echo "The specified PR is not an eligible translation PR."
          exit 1

      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate generated SEO metadata
        run: npm run validate:seo
