name: Merge Translation PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to merge manually
        required: true
        type: string

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check translation merge automation
        run: npm run typecheck:translation-merge

      - name: Merge eligible translation PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node --experimental-strip-types scripts/merge-translation-pr.ts --pr="$PR_NUMBER"
