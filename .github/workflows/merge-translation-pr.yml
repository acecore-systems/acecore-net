name: Merge Translation PR

on:
  workflow_run:
    workflows:
      - Translation PR Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to merge manually
        required: true
        type: string

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve translation pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$number" ]; then
            number="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty' || true)"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Check out current main
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.pr.outputs.number != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.number != ''
        run: npm ci

      - name: Type-check translation merge automation
        if: steps.pr.outputs.number != ''
        run: npm run typecheck:translation-merge && npm run typecheck:openai-translation

      - name: Merge eligible translation PR
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node --experimental-strip-types scripts/merge-translation-pr.ts --pr="$PR_NUMBER"
