name: Sync Vectorize search index

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 同期先のVectorize index
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      allow_large_delete:
        description: 選択したindexで20%超の削除を一度だけ許可する
        required: true
        type: boolean
        default: false
      approved_commit:
        description: 大量削除を承認した公開commitの完全SHA
        required: false
        type: string
        default: ''
      approved_corpus_version:
        description: 大量削除を承認したcorpus version
        required: false
        type: string
        default: ''
      approved_delete_count:
        description: planで確認して承認したdelete件数
        required: false
        type: string
        default: ''
      approved_plan_id:
        description: planで確認して承認したplan ID
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync-preview:
    name: Sync preview index from main
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-search-preview
    concurrency:
      group: vectorize-search-preview
      cancel-in-progress: false

    steps:
      - name: Check out protected main tooling
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Resolve main site commit
        id: site
        shell: bash
        run: |
          git -C tooling fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          site_commit="$(git -C tooling rev-parse refs/remotes/origin/main)"

          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::main commit is not a full Git SHA."
            exit 1
          fi

          echo "commit=$site_commit" >> "$GITHUB_OUTPUT"

      - name: Check out main site source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: tooling/.node-version
          cache: npm
          cache-dependency-path: |
            tooling/package-lock.json
            site/package-lock.json

      - name: Install protected tooling dependencies
        working-directory: tooling
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build main site corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
        run: npm run build

      - name: Validate preview large-delete approval
        id: large-delete
        working-directory: site
        shell: bash
        env:
          ALLOW_LARGE_DELETE: ${{ inputs.allow_large_delete || false }}
          APPROVED_COMMIT: ${{ inputs.approved_commit || '' }}
          APPROVED_CORPUS_VERSION: ${{ inputs.approved_corpus_version || '' }}
          APPROVED_DELETE_COUNT: ${{ inputs.approved_delete_count || '' }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id || '' }}
          BUILT_COMMIT: ${{ steps.site.outputs.commit }}
        run: |
          corpus_version="$(
            node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync('.vectorize/corpus.json','utf8')).version)"
          )"
          allow_large_delete=false

          if [[ "$ALLOW_LARGE_DELETE" == "true" ]]; then
            if [[ "$APPROVED_COMMIT" != "$BUILT_COMMIT" ]]; then
              echo "::error::approved_commit must exactly match the main commit."
              exit 1
            fi
            if [[ "$APPROVED_CORPUS_VERSION" != "$corpus_version" ]]; then
              echo "::error::approved_corpus_version must exactly match the built corpus."
              exit 1
            fi
            if [[ ! "$APPROVED_DELETE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::approved_delete_count must be a positive integer from a reviewed plan."
              exit 1
            fi
            if [[ ! "$APPROVED_PLAN_ID" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::approved_plan_id must be the SHA-256 ID from a reviewed plan."
              exit 1
            fi
            allow_large_delete=true
          elif [[ -n "$APPROVED_COMMIT$APPROVED_CORPUS_VERSION$APPROVED_DELETE_COUNT$APPROVED_PLAN_ID" ]]; then
            echo "::error::Approval values require allow_large_delete=true."
            exit 1
          fi

          echo "allow=$allow_large_delete" >> "$GITHUB_OUTPUT"

      - name: Sync preview Vectorize index
        working-directory: site
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SEARCH_PREVIEW_API_TOKEN }}
          VECTORIZE_INDEX_NAME: acecore-net-search-preview
          ALLOW_LARGE_DELETE: ${{ steps.large-delete.outputs.allow }}
          APPROVED_DELETE_COUNT: ${{ inputs.approved_delete_count || '' }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id || '' }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_SEARCH_PREVIEW_API_TOKEN is not configured."
            exit 1
          fi

          if [[ "$ALLOW_LARGE_DELETE" == "true" ]]; then
            plan_output="$(node ../tooling/scripts/sync-vectorize.mjs --plan)"
            printf '%s\n' "$plan_output"
            plan_json="$(
              printf '%s\n' "$plan_output" |
                grep '"event":"vectorize_sync_plan"' |
                tail -n 1
            )"
            if [[ -z "$plan_json" ]]; then
              echo "::error::Vectorize plan output is missing."
              exit 1
            fi

            actual_delete="$(
              node -e "process.stdout.write(String(JSON.parse(process.argv[1]).delete))" \
                "$plan_json"
            )"
            actual_plan_id="$(
              node -e "process.stdout.write(JSON.parse(process.argv[1]).planId)" \
                "$plan_json"
            )"
            if [[ "$actual_delete" != "$APPROVED_DELETE_COUNT" ]]; then
              echo "::error::Current delete count does not match the reviewed plan."
              exit 1
            fi
            if [[ "$actual_plan_id" != "$APPROVED_PLAN_ID" ]]; then
              echo "::error::Current plan ID does not match the reviewed plan."
              exit 1
            fi
            node ../tooling/scripts/sync-vectorize.mjs \
              --allow-large-delete \
              --expected-delete-count "$APPROVED_DELETE_COUNT" \
              --expected-plan-id "$APPROVED_PLAN_ID"
          else
            node ../tooling/scripts/sync-vectorize.mjs
          fi

  sync-production:
    name: Reconcile production index
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.target == 'production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-search-production
    concurrency:
      group: vectorize-search-production
      cancel-in-progress: false

    steps:
      - name: Check out protected main tooling
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: tooling/.node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - name: Install protected tooling dependencies
        working-directory: tooling
        run: npm ci

      - name: Wait for the pushed commit to be public
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node tooling/scripts/wait-for-deployment.mjs
          https://acecore.net/.well-known/acecore-build.json
          "$EXPECTED_COMMIT"

      - name: Resolve deployed site commit
        id: site
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMIT: ${{ github.sha }}
        run: |
          git -C tooling fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"

          if [[ "$EVENT_NAME" == "push" ]]; then
            site_commit="$PUSH_COMMIT"
          else
            site_commit="$(
              node tooling/scripts/wait-for-deployment.mjs \
                https://acecore.net/.well-known/acecore-build.json \
                --print-current
            )"
          fi
          site_commit="${site_commit,,}"

          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Published build marker does not contain a full Git SHA."
            exit 1
          fi

          if ! git -C tooling cat-file -e "${site_commit}^{commit}"; then
            echo "::error::Published commit does not exist in this repository."
            exit 1
          fi

          if ! git -C tooling merge-base --is-ancestor \
            "$site_commit" refs/remotes/origin/main; then
            echo "::error::Published commit is not an ancestor of protected main."
            exit 1
          fi

          echo "commit=$site_commit" >> "$GITHUB_OUTPUT"

      - name: Check out deployed site source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false

      - name: Install deployed site dependencies
        working-directory: site
        run: npm ci

      - name: Build deployed site corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
        run: npm run build

      - name: Confirm the built commit is still public
        env:
          BUILT_COMMIT: ${{ steps.site.outputs.commit }}
        run: >-
          node tooling/scripts/wait-for-deployment.mjs
          https://acecore.net/.well-known/acecore-build.json
          --assert-current
          "$BUILT_COMMIT"
          site/.vectorize/corpus.json

      - name: Validate manual large-delete approval
        id: large-delete
        working-directory: site
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target || '' }}
          ALLOW_LARGE_DELETE: ${{ inputs.allow_large_delete || false }}
          APPROVED_COMMIT: ${{ inputs.approved_commit || '' }}
          APPROVED_CORPUS_VERSION: ${{ inputs.approved_corpus_version || '' }}
          APPROVED_DELETE_COUNT: ${{ inputs.approved_delete_count || '' }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id || '' }}
          BUILT_COMMIT: ${{ steps.site.outputs.commit }}
        run: |
          corpus_version="$(
            node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync('.vectorize/corpus.json','utf8')).version)"
          )"
          allow_large_delete=false

          if [[ "$ALLOW_LARGE_DELETE" == "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$TARGET" != "production" ]]; then
              echo "::error::Large-delete override requires a manual production dispatch."
              exit 1
            fi
            if [[ "$APPROVED_COMMIT" != "$BUILT_COMMIT" ]]; then
              echo "::error::approved_commit must exactly match the published commit."
              exit 1
            fi
            if [[ "$APPROVED_CORPUS_VERSION" != "$corpus_version" ]]; then
              echo "::error::approved_corpus_version must exactly match the built corpus."
              exit 1
            fi
            if [[ ! "$APPROVED_DELETE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::approved_delete_count must be a positive integer from a reviewed plan."
              exit 1
            fi
            if [[ ! "$APPROVED_PLAN_ID" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::approved_plan_id must be the SHA-256 ID from a reviewed plan."
              exit 1
            fi
            allow_large_delete=true
          elif [[ -n "$APPROVED_COMMIT$APPROVED_CORPUS_VERSION$APPROVED_DELETE_COUNT$APPROVED_PLAN_ID" ]]; then
            echo "::error::Approval values require allow_large_delete=true."
            exit 1
          fi

          echo "corpus-version=$corpus_version" >> "$GITHUB_OUTPUT"
          echo "allow=$allow_large_delete" >> "$GITHUB_OUTPUT"

      - name: Sync production Vectorize index
        working-directory: site
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SEARCH_PRODUCTION_API_TOKEN }}
          VECTORIZE_INDEX_NAME: acecore-net-search-production
          ALLOW_LARGE_DELETE: ${{ steps.large-delete.outputs.allow }}
          APPROVED_DELETE_COUNT: ${{ inputs.approved_delete_count || '' }}
          APPROVED_PLAN_ID: ${{ inputs.approved_plan_id || '' }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_SEARCH_PRODUCTION_API_TOKEN is not configured."
            exit 1
          fi

          if [[ "$ALLOW_LARGE_DELETE" == "true" ]]; then
            plan_output="$(node ../tooling/scripts/sync-vectorize.mjs --plan)"
            printf '%s\n' "$plan_output"
            plan_json="$(
              printf '%s\n' "$plan_output" |
                grep '"event":"vectorize_sync_plan"' |
                tail -n 1
            )"
            if [[ -z "$plan_json" ]]; then
              echo "::error::Vectorize plan output is missing."
              exit 1
            fi

            actual_delete="$(
              node -e "process.stdout.write(String(JSON.parse(process.argv[1]).delete))" \
                "$plan_json"
            )"
            actual_plan_id="$(
              node -e "process.stdout.write(JSON.parse(process.argv[1]).planId)" \
                "$plan_json"
            )"
            if [[ "$actual_delete" != "$APPROVED_DELETE_COUNT" ]]; then
              echo "::error::Current delete count does not match the reviewed plan."
              exit 1
            fi
            if [[ "$actual_plan_id" != "$APPROVED_PLAN_ID" ]]; then
              echo "::error::Current plan ID does not match the reviewed plan."
              exit 1
            fi
            node ../tooling/scripts/sync-vectorize.mjs \
              --allow-large-delete \
              --expected-delete-count "$APPROVED_DELETE_COUNT" \
              --expected-plan-id "$APPROVED_PLAN_ID"
          else
            node ../tooling/scripts/sync-vectorize.mjs
          fi
