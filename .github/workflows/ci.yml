name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate CMS content
        run: npm run validate:content

      - name: Validate blog freshness metadata
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BLOG_FRESHNESS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BLOG_FRESHNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run validate:blog-freshness

      - name: Test blog freshness validation
        run: npm run test:blog-freshness

      - name: Test CMS proxy
        run: npm run test:cms

      - name: Test CMS OAuth Worker
        run: npm run test:cms-auth

      - name: Test shared contact routing
        run: npm run test:contact

      - name: Test site routing and static headers
        run: npm run test:site-config

      - name: Test AI chat grounding
        run: npm run test:ai-chat

      - name: Test search pipeline
        run: npm run test:search

      - name: Check generated Cloudflare binding types
        run: npm run types:cloudflare:check

      - name: Check generated CMS OAuth Worker binding types
        run: npm run types:cms-auth:check

      - name: Validate Pages Functions configuration
        run: npm run check:pages-config

      - name: Type-check Pages Functions
        run: npm run typecheck:functions

      - name: Type-check CMS OAuth Worker
        run: npm run typecheck:cms-auth

      - name: Type-check static CMS admin script
        run: npm run typecheck:admin

      - name: Build site
        run: npm run build

      - name: Validate generated SEO metadata
        run: npm run validate:seo

      - name: Validate non-ASCII tag redirects
        run: npm run validate:tag-redirects

      - name: Validate legacy redirects
        run: npm run validate:legacy-redirects
