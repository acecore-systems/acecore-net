name: Submit OpenAI Translation Batches

on:
  push:
    branches:
      - main
    paths:
      - src/content/blog/*.md
      - src/i18n/source/ja/**/*.json
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run one synthetic OpenAI Batch probe without submitting translations
        required: false
        type: boolean
        default: false
      probe_action:
        description: Synthetic probe action (submit or collect)
        required: false
        type: choice
        options:
          - submit
          - collect
        default: submit
      probe_batch_id:
        description: Batch ID from the probe submit receipt (required for collect)
        required: false
        type: string
      base_sha:
        description: Optional base SHA for changed-source detection
        required: false
        type: string
      head_sha:
        description: Optional source SHA to translate
        required: false
        type: string

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.probe_only && github.sha || inputs.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check OpenAI translation automation
        run: npm run typecheck:openai-translation

      - name: Wait for follow-up edits to the same source
        if: ${{ inputs.probe_only != true }}
        run: sleep 900

      - name: Fetch current main
        if: ${{ inputs.probe_only != true }}
        # Checkout fetched the full history. A shallow fetch can reject the
        # updated tracking ref when main advances during the 15-minute wait.
        run: git fetch origin main:refs/remotes/origin/main

      - name: Submit current OpenAI translation requests
        if: ${{ inputs.probe_only != true }}
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [ -z "$OPENAI_TRANSLATION_API_KEY" ]; then
            echo "::error::OPENAI_TRANSLATION_API_KEY is not configured; no translation job was submitted."
            exit 1
          fi

          args=(submit)
          if [ -n "$INPUT_BASE_SHA" ]; then
            args+=("--base=$INPUT_BASE_SHA")
          fi
          if [ -n "$INPUT_HEAD_SHA" ]; then
            args+=("--head=$INPUT_HEAD_SHA")
          fi
          args+=("--current-ref=origin/main")

          node --experimental-strip-types scripts/openai-translation-batch.ts "${args[@]}"

      - name: Run synthetic OpenAI Batch probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only == true }}
        timeout-minutes: 5
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROBE_ACTION: ${{ inputs.probe_action }}
          PROBE_BATCH_ID: ${{ inputs.probe_batch_id }}
        run: node --experimental-strip-types scripts/openai-translation-probe.ts "$PROBE_ACTION"

      - name: Preserve synthetic probe receipt
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.probe_only == true }}
        uses: actions/upload-artifact@v7
        with:
          name: openai-translation-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openai-translation-probe.json
            ${{ runner.temp }}/openai-translation-journal.json
            ${{ runner.temp }}/openai-translation-receipts.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve translation journal snapshots
        if: ${{ always() && inputs.probe_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-journal-submit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/meta-translation-journal.json
            ${{ runner.temp }}/meta-translation-receipts.jsonl
            ${{ runner.temp }}/openai-translation-journal.json
            ${{ runner.temp }}/openai-translation-receipts.jsonl
          if-no-files-found: ignore
          retention-days: 30
