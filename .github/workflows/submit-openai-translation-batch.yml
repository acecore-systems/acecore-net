name: Submit Policy-selected OpenAI Translation Batch

on:
  push:
    branches:
      - main
    paths:
      - src/content/blog/*.md
      - src/i18n/source/ja/**/*.json
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run one synthetic Meta probe without submitting translations
        required: false
        type: boolean
        default: false
      base_sha:
        description: Optional base SHA for changed-source detection
        required: false
        type: string
      head_sha:
        description: Optional source SHA to translate
        required: false
        type: string

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.probe_only && github.sha || inputs.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check OpenAI translation automation
        run: npm run typecheck:openai-translation

      - name: Validate shared router and provider configuration
        id: router
        if: ${{ inputs.probe_only != true }}
        env:
          AI_MODEL_ROUTER_READ_TOKEN: ${{ secrets.AI_MODEL_ROUTER_READ_TOKEN }}
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
        run: |
          if [ -z "$AI_MODEL_ROUTER_READ_TOKEN" ] || [ -z "$OPENAI_TRANSLATION_API_KEY" ]; then
            echo "::error::AI_MODEL_ROUTER_READ_TOKEN and OPENAI_TRANSLATION_API_KEY are required before submitting translations. Existing jobs can still be collected."
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("config/ai-model-router.json","utf8")); if(c.repository!=="acecore-systems/ai-model-router" || !/^[a-f0-9]{40}$/.test(c.commit)) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${c.commit}\n`);'

      - name: Check out pinned private AI model router
        if: ${{ inputs.probe_only != true }}
        uses: actions/checkout@v7
        with:
          repository: acecore-systems/ai-model-router
          ref: ${{ steps.router.outputs.commit }}
          path: .tmp/ai-model-router
          token: ${{ secrets.AI_MODEL_ROUTER_READ_TOKEN }}
          persist-credentials: false

      - name: Wait for follow-up edits to the same source
        if: ${{ inputs.probe_only != true }}
        run: sleep 900

      - name: Fetch current main
        if: ${{ inputs.probe_only != true }}
        # Checkout fetched the full history. A shallow fetch can reject the
        # updated tracking ref when main advances during the 15-minute wait.
        run: git fetch origin main:refs/remotes/origin/main

      - name: Submit current policy-selected OpenAI Batch
        if: ${{ inputs.probe_only != true }}
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          AI_MODEL_ROUTER_PATH: .tmp/ai-model-router
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          args=(submit)
          if [ -n "$INPUT_BASE_SHA" ]; then
            args+=("--base=$INPUT_BASE_SHA")
          fi
          if [ -n "$INPUT_HEAD_SHA" ]; then
            args+=("--head=$INPUT_HEAD_SHA")
          fi
          args+=("--current-ref=origin/main")

          node --experimental-strip-types scripts/openai-translation-batch.ts "${args[@]}"

      - name: Run synthetic Meta translation probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only == true }}
        timeout-minutes: 5
        env:
          META_TRANSLATION_API_KEY: ${{ secrets.META_TRANSLATION_API_KEY }}
        run: node --experimental-strip-types scripts/meta-translation-probe.ts

      - name: Preserve synthetic probe receipt
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.probe_only == true }}
        uses: actions/upload-artifact@v7
        with:
          name: meta-translation-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meta-translation-probe.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve OpenAI submission receipt
        if: ${{ always() && inputs.probe_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: openai-translation-journal-submit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openai-translation-journal.json
            ${{ runner.temp }}/openai-translation-receipts.jsonl
          if-no-files-found: ignore
          retention-days: 30
